name: PowerShell Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PowerShell Profile
        shell: pwsh
        run: |
          $RepoRoot = (Resolve-Path '.').Path
          $ProfileDir = Split-Path -Parent $PROFILE
          if (-not (Test-Path $ProfileDir)) {
            New-Item -ItemType Directory -Force -Path $ProfileDir | Out-Null
          }
          Copy-Item -Path ./Microsoft.PowerShell_profile.ps1 -Destination $PROFILE -Force
          Copy-Item -Path ./modules -Destination $ProfileDir -Recurse -Force

          $profileContent = Get-Content $PROFILE -Raw
          if ($profileContent -notmatch 'Set-StrictMode') {
            $profileContent = "`$global:__ProfileRepoRoot = '$RepoRoot'`n" + $profileContent
            Set-Content -Path $PROFILE -Value $profileContent -Encoding UTF8
          }

      - name: Run Unit Tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./tests/Test-ProfileInstallation.ps1 -Detailed
          ./tests/Microsoft.PowerShell_profile.Tests.ps1 -Verbose
