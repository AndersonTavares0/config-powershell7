name: PowerShell Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PowerShell Profile
        shell: pwsh
        run: |
          $ProfileDir = Split-Path -Parent $PROFILE
          if (-not (Test-Path $ProfileDir)) {
            New-Item -ItemType Directory -Force -Path $ProfileDir | Out-Null
          }
          Copy-Item -Path ./Microsoft.PowerShell_profile.ps1 -Destination $PROFILE -Force
          Copy-Item -Path ./modules -Destination $ProfileDir -Recurse -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $module = Get-Module -ListAvailable PSScriptAnalyzer
          if (-not $module) {
            Install-Module PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser
          }
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity @('Error', 'Warning')
          $errors = $results | Where-Object { $_.Severity -eq 'Error' }
          $warnings = $results | Where-Object { $_.Severity -eq 'Warning' }
          if ($warnings) {
            Write-Host "##[warning]$($warnings.Count) PSScriptAnalyzer warning(s) found:"
            $warnings | Format-Table -AutoSize
          }
          if ($errors) {
            Write-Host "##[error]$($errors.Count) PSScriptAnalyzer error(s) found:"
            $errors | Format-Table -AutoSize
            exit 1
          }

      - name: Run Unit Tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testPath = Join-Path $env:GITHUB_WORKSPACE 'tests/Test-ProfileInstallation.ps1'
          if (Test-Path $testPath) {
            & $testPath -Detailed
          } else {
            Write-Warning "Test file not found at: $testPath"
            Write-Warning "Current directory: $(Get-Location)"
            Write-Warning "Files in workspace:"
            Get-ChildItem $env:GITHUB_WORKSPACE -Recurse -Filter '*.ps1' | Select-Object FullName
            exit 1
          }
          $testPath2 = Join-Path $env:GITHUB_WORKSPACE 'tests/Microsoft.PowerShell_profile.Tests.ps1'
          if (Test-Path $testPath2) {
            & $testPath2 -Verbose
          }
