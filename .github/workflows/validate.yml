name: Full Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  suites:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PowerShell Profile (CI style)
        run: |
          $ErrorActionPreference = 'Stop'
          $ProfileDir = Split-Path -Parent $PROFILE
          if (-not (Test-Path $ProfileDir)) {
            New-Item -ItemType Directory -Force -Path $ProfileDir | Out-Null
          }
          Copy-Item -Path ./Microsoft.PowerShell_profile.ps1 -Destination $PROFILE -Force
          Copy-Item -Path ./modules -Destination $ProfileDir -Recurse -Force

      - name: PSScriptAnalyzer (errors block)
        run: |
          $ErrorActionPreference = 'Stop'
          $module = Get-Module -ListAvailable PSScriptAnalyzer
          if (-not $module) {
            Install-Module PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser
          }
          $errors = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($errors) {
            $errors | Format-Table -AutoSize
            exit 1
          }
          Write-Host 'PSScriptAnalyzer: 0 errors.'

      - name: Unit tests
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/Unit.Tests.ps1 -Verbose

      - name: POSH_THEME tests
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/POSH_THEME.Tests.ps1 -Verbose

      - name: Setup module tests
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/Setup.Tests.ps1 -Verbose

      - name: Profile behavioral tests
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/Microsoft.PowerShell_profile.Tests.ps1 -Verbose

      - name: Post-install health check
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tests/Test-ProfileInstallation.ps1 -Detailed

  installer:
    # Full end-to-end install on a disposable runner. Manual only:
    # installs real packages (PS7 deps, fonts, Alacritty) and takes minutes.
    # OneDrive redirection and clicked-through GUI stay on the VM checklist
    # (docs/validacao-vm.md) — runners cannot cover them faithfully.
    if: github.event_name == 'workflow_dispatch'
    needs: suites
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Seed user-owned profile content
        run: |
          $ErrorActionPreference = 'Stop'
          $target = $PROFILE.CurrentUserAllHosts
          $dir = Split-Path $target -Parent
          if (-not (Test-Path $dir)) {
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
          }
          if (-not (Test-Path $target)) {
            New-Item -ItemType File -Force -Path $target | Out-Null
          }
          $marker = '# CI-OWNED-USER-CONTENT-DO-NOT-REMOVE'
          $content = Get-Content $target -Raw -ErrorAction SilentlyContinue
          if ($content -notmatch [regex]::Escape($marker)) {
            Add-Content $target -Value "`n$marker`n" -Encoding UTF8
          }
          Write-Host "Seeded user content in: $target"

      - name: Install via PowerShell 7 (NonInteractive)
        run: |
          $ErrorActionPreference = 'Stop'
          & ./setup.ps1 -NonInteractive

      - name: Verify managed block and capture state hashes
        run: |
          $ErrorActionPreference = 'Stop'
          $target = $PROFILE.CurrentUserAllHosts
          $content = Get-Content $target -Raw -ErrorAction Stop
          if ($content -notmatch '# >>> config-powershell7 >>>') { throw 'Managed block missing from profile.' }
          if ($content -notmatch 'CI-OWNED-USER-CONTENT-DO-NOT-REMOVE') { throw 'User-owned profile content was destroyed.' }
          $files = @($target)
          $alacrittyRoot = Join-Path $env:APPDATA 'alacritty'
          if (Test-Path $alacrittyRoot) {
            $files += @(Get-ChildItem $alacrittyRoot -Recurse -File | Select-Object -ExpandProperty FullName)
          }
          $hashes = foreach ($f in $files) { Get-FileHash $f -Algorithm SHA256 }
          $stateDir = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { $env:TEMP }
          $statePath = Join-Path $stateDir 'validate-state.json'
          [PSCustomObject]@{
            Target = $target
            Files  = @($hashes | Select-Object Path, Hash)
          } | ConvertTo-Json -Depth 5 | Set-Content $statePath -Encoding UTF8
          Write-Host "State captured for $($hashes.Count) managed files."

      - name: Re-run via Windows PowerShell 5.1 (delegation + idempotency)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./setup.ps1 -NonInteractive
          # NOTE: under 5.1, $PROFILE points at WindowsPowerShell. The managed
          # profile lives at the PS7 path captured in the previous step.
          $stateDir = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { $env:TEMP }
          $state = Get-Content (Join-Path $stateDir 'validate-state.json') -Raw | ConvertFrom-Json
          $target = $state.Target
          $files = @($target)
          $alacrittyRoot = Join-Path $env:APPDATA 'alacritty'
          if (Test-Path $alacrittyRoot) {
            $files += @(Get-ChildItem $alacrittyRoot -Recurse -File | Select-Object -ExpandProperty FullName)
          }
          $after = foreach ($f in $files) { Get-FileHash $f -Algorithm SHA256 }
          $diff = Compare-Object $state.Files $after -Property Path, Hash
          if ($diff) { $diff | Format-Table -AutoSize; throw 'Repeat run rewrote managed files (not idempotent).' }
          Write-Host 'Idempotent: identical repeat run changed nothing.'

      - name: Theme change converges
        run: |
          $ErrorActionPreference = 'Stop'
          & ./setup.ps1 -NonInteractive -ThemeName 'jandedobbeleer'
          $content = Get-Content $PROFILE.CurrentUserAllHosts -Raw -ErrorAction Stop
          if ($content -notmatch 'jandedobbeleer') { throw 'Theme change did not converge to managed profile.' }
          if ($content -notmatch 'CI-OWNED-USER-CONTENT-DO-NOT-REMOVE') { throw 'Theme change destroyed user content.' }
          Write-Host 'Theme change converged.'

      - name: Child pwsh loads profile (no inherited guard)
        run: |
          $ErrorActionPreference = 'Stop'
          . $PROFILE.CurrentUserAllHosts
          pwsh -NoProfile:$false -Command "if (-not (Get-Command docs -ErrorAction SilentlyContinue)) { exit 1 }"
          Write-Host 'Child pwsh loaded profile functions.'

      - name: Component failure propagates (exit code)
        run: |
          $ErrorActionPreference = 'Stop'
          . ./lib/executable.ps1
          . ./setup/modules/core.ps1
          . ./setup/modules/deps.ps1
          . ./setup/modules/profile.ps1
          . ./setup/modules/orchestrator.ps1
          $ok = Start-ProfileInstall -RepoPath 'C:\definitely-not-here-validate' `
            -InstallPS7 $false -InstallGit $false -InstallOMP $false `
            -InstallZoxide $false -InstallFont $false -InstallModules $false `
            -InstallAlacritty $false -InstallScoop $false -InstallTopgrade $false
          if ($ok) { throw 'Failed install reported success.' }
          Write-Host 'Failure correctly reported as $false.'

      - name: Uninstall round-trip restores user content
        run: |
          $ErrorActionPreference = 'Stop'
          & ./uninstall.ps1 -NonInteractive
          $target = $PROFILE.CurrentUserAllHosts
          if (Test-Path $target) {
            $content = Get-Content $target -Raw -ErrorAction SilentlyContinue
            if ($content -match '# >>> config-powershell7 >>>') { throw 'Managed block survived uninstall.' }
            if ($content -notmatch 'CI-OWNED-USER-CONTENT-DO-NOT-REMOVE') { throw 'Uninstall destroyed user content.' }
          }
          $wrapper = Join-Path $env:APPDATA 'alacritty\alacritty.toml'
          if (Test-Path $wrapper) {
            $w = Get-Content $wrapper -Raw -ErrorAction SilentlyContinue
            if ($w -match 'config-powershell7') { throw 'Managed Alacritty wrapper survived uninstall.' }
          }
          if (Test-Path (Join-Path $env:APPDATA 'alacritty\config-powershell7')) { throw 'Owned Alacritty fragments survived uninstall.' }
          Write-Host 'Uninstall restored user state.'

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-state
          path: ${{ runner.temp }}/validate-state.json
