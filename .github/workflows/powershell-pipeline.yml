# ───────────────────────────────────────────────────────
# High-Integrity PowerShell CI/CD Pipeline
#
# Philosophy: Correctness paramount. Crash > Corrupt.
# Every script guarded by $ErrorActionPreference = 'Stop'.
# No workarounds, no silent failures, no secrets in plaintext.
# ───────────────────────────────────────────────────────

name: High-Integrity PowerShell Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ── Module caching (shared across jobs) ─────────────────
# PSScriptAnalyzer and Pester are installed from PSGallery.
# Caching avoids redundant downloads on every run and
# prevents transient gallery outages from blocking CI.
# Cache key uses runner.os so Windows and Linux runners
# maintain separate caches (module paths differ per OS).

jobs:

  # ═══════════════════════════════════════════════════════
  # JOB 1: Static Analysis & Linting
  # Runs PSScriptAnalyzer on every .ps1/.psm1 file.
  # Fails the build on ANY Warning or Error so no degraded
  # pattern ever reaches production.
  # ═══════════════════════════════════════════════════════
  static-analysis:
    name: Static Analysis (PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache PSModules (PSGallery)
        uses: actions/cache@v4
        with:
          path: ~\Documents\PowerShell\Modules
          key: ps-modules-${{ runner.os }}-v1

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber
          }

      - name: Run PSScriptAnalyzer (strict)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Collect every .ps1 and .psm1 file in the repo
          $files = Get-ChildItem -Recurse -Include '*.ps1','*.psm1' -Exclude '*.Tests.ps1' |
                   Where-Object { $_.FullName -notmatch '\\(graphify|graphify-out)\\' }

          # Invoke with full rule set. RenderRuleName makes output human-readable.
          $results = Invoke-ScriptAnalyzer -Path $files.FullName -Recurse -Severity Warning,Error

          if ($results) {
            $results | Format-Table -AutoSize -Wrap
            Write-Error "PSScriptAnalyzer found $($results.Count) issue(s). Failing build."
            exit 1
          }

          Write-Host "PSScriptAnalyzer passed — zero warnings/errors."

      - name: Scan for workarounds and bare Write-Host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $violations = @()

          # Scan ALL scripts for workaround/hack/fragile comments
          Get-ChildItem -Recurse -Include '*.ps1','*.psm1' |
            Where-Object { $_.FullName -notmatch '\\(graphify|graphify-out)\\' } |
            ForEach-Object {
              $content = Get-Content -LiteralPath $_.FullName -Raw
              if ($content -match '(?mi)^\s*#\s*(hack|workaround|TODO:\s*fragile)') {
                $violations += "$($_.Name): workaround comment detected"
              }
            }

          # Write-Host scan: only modules/ and lib/ (not installer UX scripts)
          Get-ChildItem -Path modules,lib -Recurse -Include '*.ps1','*.psm1' -ErrorAction SilentlyContinue |
            ForEach-Object {
              $content = Get-Content -LiteralPath $_.FullName -Raw
              if ($content -match '(?m)^\s*Write-Host\b') {
                $violations += "$($_.Name): bare Write-Host detected in module code"
              }
            }

          if ($violations) {
            $violations | ForEach-Object { Write-Warning $_ }
            Write-Error "Found $($violations.Count) code-quality violation(s). Failing build."
            exit 1
          }

          Write-Host "No workarounds or bare Write-Host in module code."


  # ═══════════════════════════════════════════════════════
  # JOB 2: Security & Execution Policy Audit
  # Enforces the "Crash > Corrupt" principle at the script
  # level and prevents credential leakage.
  # ═══════════════════════════════════════════════════════
  security-audit:
    name: Security Audit
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for hardcoded credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Plaintext secret patterns — deliberately broad to catch
          # variations. The list covers typical PowerShell credential
          # assignments and API-key leaks.
          $credPatterns = @(
            '\$password\s*=\s*["'']\S+["'']',
            '\$token\s*=\s*["'']\S+["'']',
            '\$apikey\s*=\s*["'']\S+["'']',
            '\$secret\s*=\s*["'']\S+["'']',
            '\$credential\s*=\s*["'']\S+["'']',
            'PlainText(Password|Secret|Key|Token)',
            'ConvertTo-SecureString\s+["''](?!-)(\S{4,})["'']',
            'Authorization:\s*Bearer\s+\S{10,}',
            'api[_-]?key\s*[:=]\s*["'']?\S{10,}["'']?'
          ) -join '|'

          $hits = @()
          Get-ChildItem -Recurse -Include '*.ps1','*.psm1','*.yml','*.yaml','*.json' |
            Where-Object { $_.FullName -notmatch '\\(graphify|graphify-out|\.git)\\' } |
            ForEach-Object {
              $content = Get-Content -LiteralPath $_.FullName -Raw
              if ($content -match $credPatterns) {
                $hits += "$($_.Name): potential credential exposed"
              }
            }

          if ($hits) {
            $hits | ForEach-Object { Write-Error $_ }
            Write-Error 'Hardcoded credential scan failed. Failing build.'
            exit 1
          }

          Write-Host 'No hardcoded credentials detected.'

      - name: Verify ErrorActionPreference = Stop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Every runnable .ps1 must declare strict error handling.
          # This prevents PowerShell's default Continue mode from
          # silently swallowing failures and corrupting state.
          $missing = @()

          Get-ChildItem -Recurse -Include '*.ps1' -Exclude '*.Tests.ps1' |
            Where-Object { $_.FullName -notmatch '\\(graphify|graphify-out)\\' } |
            ForEach-Object {
              $content = Get-Content -LiteralPath $_.FullName -Raw
              if ($content -notmatch '(?m)(\$ErrorActionPreference\s*=\s*[''"]Stop[''"])') {
                $missing += $_.Name
              }
            }

          if ($missing) {
            $missing | ForEach-Object { Write-Error "$_ missing `$ErrorActionPreference = 'Stop'" }
            Write-Error "Found $($missing.Count) script(s) without strict error handling."
            exit 1
          }

          Write-Host 'All scripts declare ErrorActionPreference = Stop.'


  # ═══════════════════════════════════════════════════════
  # JOB 3: Automated Unit Testing (Pester)
  # Runs Pester with code coverage on core logic modules.
  # Also executes invariant-violation tests that inject
  # illegal states to verify the code crashes safely rather
  # than silently corrupting.
  # ═══════════════════════════════════════════════════════
  unit-tests:
    name: Unit Tests (Pester)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache PSModules (PSGallery)
        uses: actions/cache@v4
        with:
          path: ~\Documents\PowerShell\Modules
          key: ps-modules-${{ runner.os }}-v1

      - name: Install Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Module -ListAvailable -Name Pester)) {
            Install-Module -Name Pester -Force -Scope CurrentUser -AllowClobber
          }

      - name: Run Pester with coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Import-Module Pester

          $config = New-PesterConfiguration @{
            Run    = @{ Path = 'tests\Pester.Tests.ps1'; Exit = $true }
            Output = @{ Verbosity = 'Detailed' }
            CodeCoverage = @{
              Enabled = $true
              Path    = @(
                'modules\config\config.ps1',
                'modules\cache\cache.ps1',
                'modules\git\git.ps1',
                'modules\system\system.ps1',
                'modules\text_utils\text_utils.ps1',
                'lib\platform.ps1'
              )
              # Core logic must have zero uncovered lines.
              # Non-critical wrappers are exempt from the 100% bar.
              CoveragePercentTarget = 100
            }
          }

          Invoke-Pester -Configuration $config


  # ═══════════════════════════════════════════════════════
  # JOB 4: Environmental Validation
  # Tests that scripts execute correctly in a clean session
  # with no user-profile leakage (empty $PROFILE) and no
  # reliance on ambient environment variables or modules.
  # ═══════════════════════════════════════════════════════
  env-validation:
    name: Environmental Validation
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install profile (clean session)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # -NoProfile ensures no user-specific init runs.
          # This validates zero-leakage execution.
          pwsh -NoProfile -Command {
            $ErrorActionPreference = 'Stop'
            . "$env:GITHUB_WORKSPACE\install.ps1" -NonInteractive
            if (-not (Test-Path $PROFILE)) {
              throw 'Profile installation failed: $PROFILE not created.'
            }
            $content = Get-Content $PROFILE -Raw
            if ($content -notmatch "Microsoft\.PowerShell_profile\.ps1") {
              throw 'Profile installation failed: incorrect content.'
            }
            Write-Host 'Profile installed successfully in clean session.'
          }

      - name: Verify installed modules load without errors
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Simulate what the profile does: load config first, then
          # each non-critical module in order. Any failure here means
          # the module depends on something not present in CI.
          $root = $env:GITHUB_WORKSPACE

          pwsh -NoProfile -Command {
            $ErrorActionPreference = 'Stop'

            $root = $env:GITHUB_WORKSPACE

            # Config is mandatory
            . "$root\modules\config\config.ps1"
            if (-not $script:Config) {
              throw 'Config module did not initialize.'
            }

            # Non-critical modules — each must load or report explicitly
            @('cache','navigation','git','system','psreadline','text_utils') | ForEach-Object {
              $path = "$root\modules\$_\$_.ps1"
              try {
                . $path
                Write-Host "OK: $_ loaded"
              } catch {
                Write-Error "$_ failed to load: $_"
                throw
              }
            }

            Write-Host 'All modules loaded in clean session.'
          }

      - name: Validate no user-path leakage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Detect references to $env:USERPROFILE or
          # $HOME that are not guarded by platform checks.
          # Scripts should use $PSScriptRoot-relative paths.
          $leaks = @()

          Get-ChildItem -Recurse -Include '*.ps1','*.psm1' |
            Where-Object { $_.FullName -notmatch '\\(graphify|graphify-out|tests)\\' } |
            ForEach-Object {
              $content = Get-Content -LiteralPath $_.FullName -Raw
              if ($content -match '\$env:USERPROFILE|\$env:HOMEDRIVE|\$env:HOMEPATH') {
                $leaks += $_.Name
              }
            }

          if ($leaks) {
            $leaks | ForEach-Object { Write-Warning "$_ references hardcoded user paths" }
            # Non-blocking warning — some path references are legitimate
            # in install/uninstall scripts that need to locate $PROFILE.
          }

          Write-Host 'Environment leakage scan complete.'


  # ═══════════════════════════════════════════════════════
  # JOB 5: Deploy / Artifact Signing
  # Packages all validated scripts into a GitHub Artifact
  # for downstream consumption. Only runs on main branch.
  # ═══════════════════════════════════════════════════════
  deploy:
    name: Package & Publish Artifact
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [static-analysis, security-audit, unit-tests, env-validation]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create deployable package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $staging = Join-Path $env:RUNNER_TEMP 'config-powershell7-package'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null

          # Copy only the production-ready files — no tests, no graphify,
          # no CI config, no dev artifacts.
          $sources = @(
            'Microsoft.PowerShell_profile.ps1',
            'install.ps1',
            'uninstall.ps1',
            'LICENSE',
            'modules',
            'lib'
          )

          foreach ($src in $sources) {
            $dst = Join-Path $staging $src
            $parent = Split-Path $dst -Parent
            if ($parent -and -not (Test-Path $parent)) {
              New-Item -ItemType Directory -Path $parent -Force | Out-Null
            }
            Copy-Item -Path $src -Destination $dst -Recurse -Force
          }

          Write-Host "Package staged at $staging"

          # Create a versioned zip and export via step outputs
          # (not $env:GITHUB_ENV — env: context is compile-time for upload-artifact)
          $version = (Get-Date -Format 'yyyyMMdd-HHmmss')
          $zipName = "config-powershell7-$version.zip"
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName

          Compress-Archive -Path "$staging\*" -DestinationPath $zipPath -CompressionLevel Optimal
          Write-Host "Package: $zipPath"

          "name=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 30
